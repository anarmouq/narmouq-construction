<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elevated Deck & Paver Patio — 3D Build Model</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --panel: rgba(251,251,248,0.95);
  --ink:#2b2e31;
  --muted:#656b70;
  --line:rgba(43,46,49,0.14);
  --seg:#dcdfdb;
  --accent:#8c3b1f;
  --accent-ink:#ffffff;
  --chip:#eceee9;
  --chip-on:#2b2e31;
  --chip-on-ink:#fbfbf8;
  --bg:#d9e3ec;
  --shadow:0 12px 32px rgba(18,24,30,.22);
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --panel: rgba(31,34,37,0.94); --ink:#eceeea; --muted:#a3a9ae; --line:rgba(255,255,255,0.12);
    --seg:#3a3f43; --accent:#d47a4c; --accent-ink:#1d1f21; --chip:#2d3135; --chip-on:#eceeea; --chip-on-ink:#1f2225;
    --bg:#1a1d20; --shadow:0 12px 32px rgba(0,0,0,.45); color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --panel: rgba(31,34,37,0.94); --ink:#eceeea; --muted:#a3a9ae; --line:rgba(255,255,255,0.12);
  --seg:#3a3f43; --accent:#d47a4c; --accent-ink:#1d1f21; --chip:#2d3135; --chip-on:#eceeea; --chip-on-ink:#1f2225;
  --bg:#1a1d20; --shadow:0 12px 32px rgba(0,0,0,.45); color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased}
#app{position:relative;height:100%;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:absolute;left:12px;right:12px;top:10px;display:flex;flex-direction:column;gap:8px;pointer-events:none;z-index:3}
.title{pointer-events:auto;align-self:flex-start;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:14px;padding:9px 14px 9px 12px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center}
.title svg{flex:none}
.title h1{font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:17px;letter-spacing:.01em;margin:0;line-height:1.1}
.title p{margin:1px 0 0;font-size:12.5px;color:var(--muted)}
.views{pointer-events:auto;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 6px;margin:0 -2px;-webkit-overflow-scrolling:touch}
.views::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--ink);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:500;box-shadow:0 4px 14px rgba(18,24,30,.14);cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink)}

.sheet{position:absolute;left:0;right:0;bottom:0;z-index:4;background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:20px 20px 0 0;box-shadow:var(--shadow);padding:6px 16px 14px;max-height:72%;display:flex;flex-direction:column}
.handle{display:block;margin:0 auto 4px;width:56px;height:22px;border:0;background:none;cursor:pointer;position:relative}
.handle::after{content:"";position:absolute;left:14px;right:14px;top:9px;height:4px;border-radius:2px;background:var(--line)}
.phase{display:flex;align-items:flex-end;gap:12px;min-height:56px}
.num{font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:52px;line-height:.85;color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:-.01em;min-width:58px}
.num small{font-size:15px;font-weight:600;color:var(--muted);margin-left:2px;letter-spacing:0}
.ptitle{flex:1;min-width:0}
.ptitle .of{font-size:12.5px;color:var(--muted)}
.ptitle h2{margin:0;font-family:'Barlow Semi Condensed',sans-serif;font-weight:600;font-size:21px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.timeline{position:relative;margin:12px 0 4px;height:30px}
.segs{position:absolute;left:0;right:0;top:11px;height:8px;display:flex;gap:3px}
.seg{flex:1;border-radius:2px;background:var(--seg);overflow:hidden;position:relative}
.seg i{position:absolute;inset:0;background:var(--accent);transform-origin:left center;transform:scaleX(0)}
#build{position:absolute;inset:0;width:100%;height:30px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer}
#build::-webkit-slider-runnable-track{height:30px;background:transparent}
#build::-moz-range-track{height:30px;background:transparent}
#build::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:4px;border-radius:50%;background:var(--panel);border:3px solid var(--accent);box-shadow:0 2px 6px rgba(0,0,0,.25)}
#build::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--panel);border:3px solid var(--accent);box-shadow:0 2px 6px rgba(0,0,0,.25)}

.transport{display:flex;gap:8px;margin-top:8px}
.btn{border:0;border-radius:12px;background:var(--chip);padding:10px 12px;font-weight:600;font-size:14.5px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px}
.btn svg{flex:none}
.btn.primary{flex:1;background:var(--accent);color:var(--accent-ink)}
.btn.icon{width:46px;padding:0}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}

.more{overflow-y:auto;margin:12px -16px 0;padding:0 16px;border-top:1px solid var(--line);-webkit-overflow-scrolling:touch}
.sheet.collapsed .more{display:none}
.desc{margin:12px 0 8px;max-width:62ch}
.specs{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:6px}
.specs li{position:relative;padding-left:16px;font-size:14px;color:var(--ink)}
.specs li::before{content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;border-radius:1.5px;background:var(--accent);opacity:.8}
.group{padding:12px 0;border-top:1px solid var(--line)}
.group h3{margin:0 0 8px;font-family:'Barlow Semi Condensed',sans-serif;font-weight:600;font-size:15px}
.rowr{display:flex;align-items:center;gap:12px}
.rowr span{font-size:13px;color:var(--muted);min-width:52px;text-align:right;font-variant-numeric:tabular-nums}
#explode{flex:1;accent-color:var(--accent);height:30px}
.toggles{display:flex;flex-wrap:wrap;gap:6px}
.toggles .chip{box-shadow:none;background:var(--chip);backdrop-filter:none}
.toggles .chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink)}
.hint{font-size:12.5px;color:var(--muted);margin:10px 0 2px}

.info{position:absolute;z-index:5;left:12px;right:12px;top:118px;background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:16px;box-shadow:var(--shadow);padding:12px 14px 13px;max-width:380px;border-left:4px solid var(--accent)}
.info[hidden]{display:none}
.info .k{font-size:12.5px;color:var(--muted)}
.info h4{margin:1px 0 4px;font-family:'Barlow Semi Condensed',sans-serif;font-weight:600;font-size:18px;padding-right:28px}
.info p{margin:0;font-size:14px}
.info .x{position:absolute;right:6px;top:6px;width:36px;height:36px;border:0;background:none;border-radius:10px;cursor:pointer;font-size:20px;line-height:1;color:var(--muted)}

.loading{position:absolute;inset:0;display:grid;place-items:center;z-index:9;background:var(--bg);transition:opacity .5s}
.loading div{font-family:'Barlow Semi Condensed',sans-serif;font-weight:600;font-size:18px;color:var(--muted)}
.loading.done{opacity:0;pointer-events:none}

@media (min-width:900px){
  .top{left:20px;right:auto;top:18px;max-width:calc(100% - 440px)}
  .sheet{left:20px;right:auto;bottom:20px;top:auto;width:380px;border-radius:20px;max-height:calc(100% - 140px)}
  .sheet .handle{display:none}
  .sheet.collapsed .more{display:block}
  .info{left:auto;right:20px;top:18px;width:340px}
}
@media (prefers-reduced-motion: reduce){ .loading{transition:none} }
</style>
</head>
<body>
<div id="app">
  <canvas id="c" tabindex="0" aria-label="3D model of the elevated deck and paver patio. Drag to orbit, pinch to zoom, tap a part for its spec."></canvas>

  <div class="top">
    <div class="title">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect x="2" y="9" width="26" height="4" rx="1" fill="var(--accent)"/><rect x="4" y="13" width="3" height="15" fill="var(--accent)" opacity=".75"/><rect x="23" y="13" width="3" height="15" fill="var(--accent)" opacity=".75"/><path d="M3 9V4M8 9V4M13 9V4M18 9V4M23 9V4M27 9V4M2 4h26" stroke="currentColor" stroke-width="1.6" fill="none" opacity=".55"/></svg>
      <div><h1>Elevated deck &amp; paver patio</h1><p>Interactive build model</p></div>
    </div>
    <nav class="views" id="views" aria-label="Camera views"></nav>
  </div>

  <aside class="info" id="info" hidden aria-live="polite">
    <button class="x" id="infoClose" aria-label="Close part details">×</button>
    <div class="k" id="infoPhase"></div>
    <h4 id="infoTitle"></h4>
    <p id="infoText"></p>
  </aside>

  <section class="sheet collapsed" id="sheet" aria-label="Build controls">
    <button class="handle" id="handle" aria-label="Show build details" aria-expanded="false"></button>
    <div class="phase">
      <div class="num" id="pNum">16</div>
      <div class="ptitle"><div class="of" id="pOf">All 16 phases</div><h2 id="pTitle">Finished build</h2></div>
    </div>
    <div class="timeline">
      <div class="segs" id="segs"></div>
      <input type="range" id="build" min="0" max="16" step="0.001" value="1" aria-label="Build progress">
    </div>
    <div class="transport">
      <button class="btn ghost" id="btnApart"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8a5 5 0 1 0 1.6-3.7M3 2.5v3h3" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>Take apart</button>
      <button class="btn icon" id="btnPrev" aria-label="Previous phase"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="btn primary" id="btnPlay"><svg id="playIcon" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 1.5v11l9-5.5z" fill="currentColor"/></svg><span id="playLabel">Build</span></button>
      <button class="btn icon" id="btnNext" aria-label="Next phase"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3 5 5-5 5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <div class="more" id="more">
      <p class="desc" id="pDesc"></p>
      <ul class="specs" id="pSpecs"></ul>
      <div class="group">
        <h3>Explode layers</h3>
        <div class="rowr"><input type="range" id="explode" min="0" max="1" step="0.001" value="0" aria-label="Explode layers"><span id="exVal">0%</span></div>
      </div>
      <div class="group">
        <h3>Layers</h3>
        <div class="toggles" id="toggles">
          <button class="chip" data-t="house" aria-pressed="true">House</button>
          <button class="chip" data-t="grade" aria-pressed="false">See below grade</button>
          <button class="chip" data-t="dims" aria-pressed="false">Dimensions</button>
          <button class="chip" data-t="dusk" aria-pressed="false">Evening</button>
          <button class="chip" data-t="night" aria-pressed="false">Night</button>
        </div>
        <p class="hint">Drag to orbit, pinch or scroll to zoom, two fingers or right-drag to pan. Tap any part for its spec.</p>
      </div>
    </div>
  </section>

  <div class="loading" id="loading"><div id="loadMsg">Framing the deck…</div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
'use strict';
function showProblem(msg){ const l=document.getElementById('loading'), m=document.getElementById('loadMsg'); if (l){ l.classList.remove('done'); } if (m){ m.innerHTML=msg; } }
window.addEventListener('error', e => showProblem('The model hit an error and stopped:<br><small>'+String(e.message||e).replace(/[<>&]/g,'')+'</small>'));
if (typeof THREE === 'undefined') { document.getElementById('loadMsg').textContent = 'The 3D library didn’t load. Check your connection and reload.'; return; }

/* ================================================================
   DIMENSIONS (feet). Edit these to match the as-built plans.
   x = along the house (right is +), z = out from the house, y = up.
   Patio surface is y = 0. House rear wall is z = 0.
================================================================ */
const H = 10.75;                 // top of decking above patio (10'-9")
const DT = 1/12;                 // decking / tread thickness
const T2 = 1.5/12;               // 2x lumber thickness
const JD = 11.25/12;             // 2x12 depth
const JT = H - DT;               // top of joists
const JB = JT - JD;              // bottom of joists / top of beams
const BB = JB - JD;              // bottom of beams (clear headroom)
const POST = 5.5/12;             // 6x6 actual
// Deck plan (from photos, aligned to the permit drawings of the house):
// main deck 14' deep; a 6'-5" bump-out to 18' at the stair top (pull-up bar posts);
// stair runs down in front of the left section; short right section over the shed.
const L_X0 = -12.6, C_X0 = 0, C_X1 = 6.4, R_X1 = 11.4;
const L_D = 14, C_D = 18, R_D = C_D;
const M_BEAM = 12.5, C_BEAM = 16.5;
const POSTS_M = [-12.1, -6.2, 0.2, 6.2, 10.9];
const POSTS_C = [0.25, 6.15];
const DECK_AREA = Math.round((C_X0-L_X0)*L_D + (C_X1-C_X0)*C_D + (R_X1-C_X1)*L_D);
const RISE = H / 18;             // 16 risers to the landing; landing is one riser above the upper paver level
const RUN = 10/12;
const NT = 15;                   // treads between landing and deck
const LANDTOP = 2*RISE;
const STEP_UP = 0.55;            // single step from the patio up to the upper paver level / walkway
const SX0 = -0.06;               // stair top (face of fascia)
const SZ0 = L_D+0.1, SZ1 = C_D+0.1;    // stair runs in front of the left section
const SLOPE = RISE / RUN;
const B0 = H - RISE - DT - 0.53;   // stringer underside at the top
const N = 16;                    // build phases
const RPW = 4.5/12;              // vinyl rail post sleeve

/* ================================================================ */
let seed = 20261110;
function rnd(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const col = h => new THREE.Color(h).convertSRGBToLinear();
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const smooth = t => { t = clamp(t,0,1); return t*t*(3-2*t); };
const easeOut = t => 1 - Math.pow(1-t, 3);
const easeIO = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
const V = (x,y,z) => new THREE.Vector3(x,y,z);
const BIG_SCREEN = (window.innerWidth||0) >= 900;
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------------- renderer / scene ---------------- */
const canvas = document.getElementById('c');
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true }); }
catch (err) { showProblem('This browser couldn’t start 3D graphics (WebGL).<br><small>Try opening the link in Safari or Chrome, or check that hardware acceleration is on.</small>'); return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, 1, 0.3, 1600);
const MAXANI = Math.min(8, renderer.capabilities.getMaxAnisotropy());

/* ---------------- procedural textures ---------------- */
function cv(w,h){ const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function tex(c, rx, ry){ const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.encoding = THREE.sRGBEncoding; t.anisotropy = MAXANI; if (rx) t.repeat.set(rx, ry || rx); return t; }
function noise(g,w,h,amt){ const id = g.getImageData(0,0,w,h), d = id.data; for (let i=0;i<d.length;i+=4){ const n = (rnd()-0.5)*amt; d[i]+=n; d[i+1]+=n; d[i+2]+=n; } g.putImageData(id,0,0); }

function grainCanvas(base){
  const w=512,h=128,c=cv(w,h),g=c.getContext('2d');
  g.fillStyle=`rgb(${base},${base},${base})`; g.fillRect(0,0,w,h);
  for (let i=0;i<110;i++){
    const y0=rnd()*h, amp=1+rnd()*4, f=1+Math.floor(rnd()*3), ph=rnd()*6.28;
    const v = rnd()<0.65 ? base-45-rnd()*55 : Math.min(255, base+18);
    g.strokeStyle=`rgba(${v|0},${v|0},${v|0},${0.12+rnd()*0.32})`; g.lineWidth=0.6+rnd()*2.4;
    g.beginPath();
    for (let x=0;x<=w;x+=8){ const y=y0+Math.sin(x/w*Math.PI*2*f+ph)*amp; if(x===0) g.moveTo(x,y); else g.lineTo(x,y); }
    g.stroke();
  }
  for (let k=0;k<3;k++){ const x=40+rnd()*(w-80), y=20+rnd()*(h-40), r=3+rnd()*5; const gr=g.createRadialGradient(x,y,0,x,y,r*2.4); gr.addColorStop(0,'rgba(70,70,70,0.55)'); gr.addColorStop(1,'rgba(70,70,70,0)'); g.fillStyle=gr; g.beginPath(); g.ellipse(x,y,r*2.4,r,0,0,Math.PI*2); g.fill(); }
  noise(g,w,h,12); return c;
}
function compositeCanvas(){
  const w=1024,h=128,c=cv(w,h),g=c.getContext('2d');
  g.fillStyle='#5a3a30'; g.fillRect(0,0,w,h);
  for (let i=0;i<90;i++){
    const y=rnd()*h, len=200+rnd()*700, x=rnd()*w, dark=rnd()<0.55;
    g.strokeStyle = dark ? `rgba(38,20,16,${0.2+rnd()*0.35})` : `rgba(140,98,76,${0.1+rnd()*0.2})`;
    g.lineWidth = 1+rnd()*5;
    for (const off of [0,-w]){ g.beginPath(); g.moveTo(x+off,y); g.bezierCurveTo(x+off+len*.3,y+rnd()*6-3,x+off+len*.6,y+rnd()*6-3,x+off+len,y+rnd()*4-2); g.stroke(); }
  }
  noise(g,w,h,10); return c;
}
function drawPaver(g,x,y,w,h,cols){
  const j=2.4; g.save(); g.beginPath(); g.rect(x+j/2,y+j/2,w-j,h-j); g.clip();
  g.fillStyle=cols[(rnd()*cols.length)|0]; g.fillRect(x,y,w,h);
  for (let i=0;i<7;i++){ g.fillStyle = rnd()<0.5 ? `rgba(88,82,74,${0.05+rnd()*0.13})` : `rgba(240,230,210,${0.05+rnd()*0.14})`; g.beginPath(); g.ellipse(x+rnd()*w,y+rnd()*h,4+rnd()*w*0.4,3+rnd()*h*0.35,rnd()*3,0,6.283); g.fill(); }
  g.fillStyle='rgba(255,255,255,0.10)'; g.fillRect(x,y+j/2,w,2); g.fillStyle='rgba(0,0,0,0.14)'; g.fillRect(x,y+h-j/2-2,w,2);
  g.restore();
}
function paverCanvas(){
  const S=512,ppf=64,c=cv(S,S),g=c.getContext('2d');
  g.fillStyle='#8a8276'; g.fillRect(0,0,S,S);
  const cols=['#bba98f','#ab9e8b','#c6b59b','#9f9383','#b4a58c','#cfc1a6','#a49683','#b8ad9c'];
  let y=0;
  while (y<S){ let rh=(rnd()<0.5?6:9)/12*ppf; if (S-y<rh+16) rh=S-y; let x=-((rnd()*40)|0);
    while (x<S){ const rw=[6,9,12][(rnd()*3)|0]/12*ppf; drawPaver(g,x,y,rw,rh,cols); x+=rw; }
    y+=rh; }
  noise(g,S,S,16); return c;
}
function bandCanvas(colsIn, count){
  const w=256,h=64,c=cv(w,h),g=c.getContext('2d');
  g.fillStyle='#4a4a4c'; g.fillRect(0,0,w,h);
  const bw=w/count;
  for (let i=0;i<count;i++) drawPaver(g,i*bw,0,bw,h,colsIn);
  noise(g,w,h,12); return c;
}
function blockCanvas(){

function boxGeo(w,h,d,su,sv,uoff){
  su = su || 4; sv = sv || 1; uoff = uoff || 0;
  const g = new THREE.BoxGeometry(w,h,d), uv = g.attributes.uv;
  const dims = [[d,h],[d,h],[w,d],[w,d],[w,h],[w,h]];

}
function gbox(w,h,d,x,y,z,su,sv,uoff){ const g = boxGeo(w,h,d,su,sv,uoff); g.translate(x,y,z); return g; }
function gboxZ(len,h,w,x,y,z,su,sv,uoff){ const g = boxGeo(len,h,w,su,sv,uoff); g.rotateY(Math.PI/2); g.translate(x,y,z); return g; }
function gboxY(len,a,b,x,y,z,su,sv,uoff){ const g = boxGeo(len,a,b,su,sv,uoff); g.rotateZ(Math.PI/2); g.translate(x,y,z); return g; }
function scaleUV(g,su,sv){ const uv = g.attributes.uv; for (let i=0;i<uv.count;i++) uv.setXY(i, uv.getX(i)*su, uv.getY(i)*sv); uv.needsUpdate = true; return g; }

function mergeGeos(list){
  const P=[],Nn=[],U=[]; let n=0;
  for (let g of list){ if (g.index) g = g.toNonIndexed(); if (!g.attributes.normal) g.computeVertexNormals();
    P.push(g.attributes.position.array); Nn.push(g.attributes.normal.array);
    U.push(g.attributes.uv ? g.attributes.uv.array : new Float32Array(g.attributes.position.count*2)); n += g.attributes.position.count; }
  const cat = (arrs,size) => { const out = new Float32Array(n*size); let o=0; for (const a of arrs){ out.set(a,o); o+=a.length; } return out; };
  const m = new THREE.BufferGeometry();
  m.setAttribute('position', new THREE.BufferAttribute(cat(P,3),3));
  m.setAttribute('normal', new THREE.BufferAttribute(cat(Nn,3),3));
  m.setAttribute('uv', new THREE.BufferAttribute(cat(U,2),2));
  m.computeBoundingSphere(); m.computeBoundingBox();
  return m;
}

  const n=A.length, pos=new Float32Array(n*6), uv=new Float32Array(n*4), idx=[];
  for (let i=0;i<n;i++){ pos.set(A[i],i*6); pos.set(B[i],i*6+3); uv.set(uvA[i],i*4); uv.set(uvB[i],i*4+2); if (i<n-1){ const a=2*i; idx.push(a,a+2,a+1,a+1,a+2,a+3); } }

const root = new THREE.Group(); scene.add(root);
const parts = [];
function addPart(obj, phase, kind, opts){
  opts = opts || {};
  const pi = parts.length;
  obj.traverse(o => { if (o.isMesh){ o.castShadow = opts.cast !== false; o.receiveShadow = true; o.userData.pi = pi; } });
  root.add(obj);
  parts.push({ obj, phase, kind, base: obj.position.clone(), ex: opts.ex || null, group: opts.group || 'build', key: opts.key !== undefined ? opts.key : pi, drop: opts.drop !== undefined ? opts.drop : 3, t: 0 });
  return obj;
}

function grade(x,z){
  // back yard falls away downhill past the patio
  const back = -0.05 - 2.1*smooth((x+3)/20)*smooth((z-3)/13) - 0.5*smooth((z-22)/30)*smooth((x+5)/40) - 2.2*smooth((z-24)/40) - 0.09*Math.max(0, z-60);
  // garage side climbs from the patio to the street; lawn rises a little toward the arborvitae line
  const side = smooth((-x-22)/8)*sideH(z) + clamp((-x-52)*0.06, 0, 1.5);
  const raised = 1.45*smooth((-x-13.2)/0.5)*(1-smooth((z-7.9)/2.2))*(1-smooth((-x-25.5)/2));
  return back + Math.max(side, FRONT_Y*smooth((-z-3)/24), raised);
}

const stars = (() => { const n=1100, pos=new Float32Array(n*3); for (let i=0;i<n;i++){ const u=rnd()*Math.PI*2, v=0.06+rnd()*0.94, r=650, c=Math.sqrt(1-v*v); pos.set([Math.cos(u)*c*r, v*r, Math.sin(u)*c*r], i*3); }
  const g=new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const p=new THREE.Points(g, new THREE.PointsMaterial({ color:0xffffff, size:1.6, sizeAttenuation:false, transparent:true, opacity:0.85, fog:false, depthWrite:false })); p.visible=false; scene.add(p); return p; })();
const moon = new THREE.Mesh(new THREE.SphereGeometry(9,20,12), new THREE.MeshBasicMaterial({ color:0xf4f1e2, fog:false })); moon.position.set(-260,330,420); moon.visible=false; scene.add(moon);
scene.fog = new THREE.Fog(0xd7e6f3, 180, 640);
const fill = new THREE.DirectionalLight(0xdfe8ff, 0.55); fill.position.set(30, 25, -10); scene.add(fill);
const LIGHT = {
  day:   { top:'#5f9be0', mid:'#d7e6f3', bot:'#9db07a', sun:'#fff2de', sunI:2.3,  sunPos:[-26,50,40],  hemiSky:'#dde9ff', hemiGnd:'#56663a', hemi:0.85, fill:0.55, exp:1.0,  fog:'#d7e6f3', fogN:180, fogF:640, bulb:0.12, solar:0,   lamp:0,   glass:0,    key:null },
  dusk:  { top:'#121c38', mid:'#c9794a', bot:'#23261c', sun:'#ff9e5e', sunI:0.38, sunPos:[-70,12,26],  hemiSky:'#dde9ff', hemiGnd:'#56663a', hemi:0.2,  fill:0.05, exp:1.15, fog:'#c99a72', fogN:180, fogF:640, bulb:4.2,  solar:3.6, lamp:3.0, glass:0.3,  key:'dusk' },
  night: { top:'#03050c', mid:'#0d1424', bot:'#05070a', sun:'#9fb4ff', sunI:0.16, sunPos:[-30,42,48],  hemiSky:'#24345e', hemiGnd:'#07080b', hemi:0.12, fill:0.02, exp:1.3,  fog:'#0a101c', fogN:120, fogF:520, bulb:5.5,  solar:5.0, lamp:4.2, glass:0.5,  key:'night' }
};
function buildEnv(mode){ const L = LIGHT[mode] || LIGHT.day; hemi.color.set(L.hemiSky); hemi.groundColor.set(L.hemiGnd); hemi.intensity = L.hemi; fill.intensity = L.fill; }
function setLight(mode){
  const L = LIGHT[mode] || LIGHT.day;
  skyU.top.value.set(L.top); skyU.mid.value.set(L.mid); skyU.bot.value.set(L.bot);
  sun.color.set(L.sun); sun.intensity = L.sunI; sun.position.set(L.sunPos[0], L.sunPos[1], L.sunPos[2]); sun.position.add(sun.target.position);
  M.bulb.emissiveIntensity = L.bulb; M.solar.emissiveIntensity = L.solar; M.lamp.emissiveIntensity = L.lamp; M.ember.emissiveIntensity = L.lamp; M.glass.emissiveIntensity = L.glass;
  glowLights.forEach(l => { l.intensity = L.key ? l.userData[L.key] : 0; });
  renderer.toneMappingExposure = L.exp; scene.fog.color.set(L.fog); scene.fog.near = L.fogN; scene.fog.far = L.fogF;
  stars.visible = moon.visible = (mode === 'night');
  buildEnv(mode);
}
function setDusk(on){ setLight(on ? 'dusk' : 'day'); }

/* ================================================================
   BUILD ORDER
================================================================ */
for (let k=0;k<N;k++){ const ps = parts.filter(p => p.phase===k).sort((a,b) => a.key-b.key); ps.forEach((p,i) => { p.t = ps.length>1 ? i/ps.length : 0; }); }

const state = { build:1,   /* start on phase 1 (footings); use N to start on the finished build */ explode:0, exTarget:0, playing:false, dir:1, animTo:null, house:true, furn:true, grade:false, dims:false, dusk:false };
let lastStain = -1;
function applyStain(s){ if (Math.abs(s-lastStain) < 1e-4) return; lastStain = s; M.framing.color.copy(C_RAW).lerp(C_CEDAR, s); M.treadWood.color.copy(C_RAW).lerp(C_DARK, s); }
function applyBuild(){
  const b = state.build, ex = state.explode;
  for (const p of parts){
    const local = clamp((b - POS[p.phase] - p.t*0.7)/0.3, 0, 1);
    const vis = local > 0 && (p.group !== 'furn' || state.furn);
    p.obj.visible = vis; if (!vis) continue;
    const e = easeOut(local), v = p.ex || PH[p.phase].ex;
    p.obj.position.set(p.base.x + v[0]*ex, p.base.y + v[1]*ex + (1-e)*p.drop, p.base.z + v[2]*ex);
  }
  applyStain(clamp(b-POS[14], 0, 1));
  const dug = b > EXC_POS + 0.001; maskOn.value = dug ? 1 : 0; EXC.forEach(o => { o.visible = dug; });
  if (selected) selBox.update();
}
const GRADE_MATS = [M.lawn, M.dirt, M.gravel, M.sand, M.paver, M.paverTop, M.edge, M.band, M.block];
function setGrade(on){ GRADE_MATS.forEach(m => { m.transparent = on; m.opacity = on ? 0.28 : 1; m.depthWrite = !on; m.needsUpdate = true; }); }

/* ================================================================
   CAMERA, CONTROLS, VIEWS
================================================================ */
const controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.08; controls.screenSpacePanning = true;
controls.minDistance = 3; controls.maxDistance = 190; controls.maxPolarAngle = Math.PI*0.6;
controls.addEventListener('change', () => { dirty = true; });
const VIEWS = [
  { id:'hero', label:'Overview', p:[-31,8,39], t:[-2,6.5,6] },
  { id:'yard', label:'From the yard', p:[-4,5.5,58], t:[-6,10,4] },
  { id:'stairs', label:'Stairs', p:[-28,5.5,24], t:[-6,4.5,15] },
  { id:'under', label:'Under the deck', p:[-1.5,5,3.6], t:[-14,4.6,18] },
  { id:'framing', label:'Framing', p:[20,2.4,28], t:[0,9.5,8] },
  { id:'side', label:'Side', p:[38,7,22], t:[0,7,6] },
  { id:'walk', label:'Walkway', p:[-52,9,31], t:[-40,3,2] },
  { id:'street', label:'From the street', p:[-12,19,-102], t:[-12,15,-42] },
  { id:'above', label:'Above', p:[26,54,52], t:[-6,3,6] }
];
let tween = null;
function goView(v, instant){
  const to = { p:V(...v.p), t:V(...v.t) };
  // pull back on tall, narrow screens so the whole deck fits
  const k = clamp(Math.sqrt(1.4/Math.max(0.3, camera.aspect)), 1, v.id==='under' ? 1.15 : 1.9);
  to.p.sub(to.t).multiplyScalar(k).add(to.t);
  if (instant || reduceMotion){ camera.position.copy(to.p); controls.target.copy(to.t); controls.update(); dirty = true; return; }
  tween = { from:{ p:camera.position.clone(), t:controls.target.clone() }, to, s:performance.now(), d:1100 };
  document.querySelectorAll('#views .chip').forEach(c => c.setAttribute('aria-pressed', c.dataset.v===v.id ? 'true':'false'));
}

/* ================================================================
   PICKING
================================================================ */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let selected = null;
const selBox = new THREE.BoxHelper(undefined, 0xffb000); selBox.visible = false; selBox.material.depthTest = false; selBox.renderOrder = 22; scene.add(selBox);
function chainVisible(o){ while (o){ if (!o.visible) return false; o = o.parent; } return true; }
function pick(cx, cy){
  const r = canvas.getBoundingClientRect(); ndc.set(((cx-r.left)/r.width)*2-1, -((cy-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(root.children, true);
  const hit = hits.find(h => h.object.userData.pi !== undefined && chainVisible(h.object));
  if (!hit){ clearSel(); return; }
  const p = parts[hit.object.userData.pi]; selected = p;
  selBox.setFromObject(p.obj); selBox.visible = true;
  const sp = SPEC[p.kind] || [p.kind, ''];
  document.getElementById('infoTitle').textContent = sp[0];
  document.getElementById('infoText').textContent = sp[1];
  document.getElementById('infoPhase').textContent = `Phase ${POS[p.phase]+1}: ${PH[p.phase].t}`;
  document.getElementById('info').hidden = false;
  dirty = true;
}
function clearSel(){ selected = null; selBox.visible = false; document.getElementById('info').hidden = true; dirty = true; }
let down = null;
canvas.addEventListener('pointerdown', e => { down = { x:e.clientX, y:e.clientY, t:performance.now() }; if (tween) tween = null; });
canvas.addEventListener('pointerup', e => { if (!down) return; const d = Math.hypot(e.clientX-down.x, e.clientY-down.y); if (d < 7 && performance.now()-down.t < 450) pick(e.clientX, e.clientY); down = null; });
document.getElementById('infoClose').addEventListener('click', clearSel);

/* ================================================================
   UI
================================================================ */
const $ = id => document.getElementById(id);
const segsEl = $('segs'), segFill = [];
for (let i=0;i<N;i++){ const s=document.createElement('div'); s.className='seg'; const f=document.createElement('i'); s.appendChild(f); segsEl.appendChild(s); segFill.push(f); }
const viewsEl = $('views');
VIEWS.forEach(v => { const b=document.createElement('button'); b.className='chip'; b.textContent=v.label; b.dataset.v=v.id; b.setAttribute('aria-pressed', v.id==='hero'?'true':'false'); b.addEventListener('click', () => goView(v)); viewsEl.appendChild(b); });
const sheet = $('sheet'), handle = $('handle');
handle.addEventListener('click', () => { const c = sheet.classList.toggle('collapsed'); handle.setAttribute('aria-expanded', c ? 'false':'true'); handle.setAttribute('aria-label', c ? 'Show build details' : 'Hide build details'); resize(); });

let lastPhaseShown = null, dragging = false;
function phaseIndex(){ const b=state.build; if (b <= 0.001) return -1; if (b >= N-0.001) return N; return Math.ceil(b-1e-6)-1; }
function updateUI(){
  const b = state.build;
  for (let i=0;i<N;i++) segFill[i].style.transform = `scaleX(${clamp(b-i,0,1)})`;
  if (!dragging) $('build').value = b.toFixed(3);
  const idx = phaseIndex();
  if (idx !== lastPhaseShown){
    lastPhaseShown = idx;
    let num, of, title, desc, specs;
    if (idx < 0){ num='0'; of='Before construction'; title='The yard before construction'; desc='Lawn behind the walk-out basement. Press Build to watch the deck go up first, then the patio, or drag the timeline.'; specs=[`${Math.round(PATIO_AREA)} sq ft patio footprint`,`${DECK_AREA} sq ft elevated deck at ${ftin(H)}`]; }
    else if (idx >= N){ num=String(N); of=`All ${N} phases`; title='Finished build'; desc='The complete deck and patio. Take it apart, step through phases, or tap any part for its spec.'; specs=[`${DECK_AREA} sq ft stained wood deck at ${ftin(H)}`,`${Math.round(PATIO_AREA)} sq ft paver patio with retaining and seat walls`,`16-riser stair with landing and graspable handrail`,`Nine footings below frost depth`]; }
    else { const p=PH[ORDER[idx]]; num=String(idx+1); of=`Phase ${idx+1} of ${N}`; title=p.t; desc=p.d; specs=p.s; }
    $('pNum').textContent = num.padStart(2,'0');
    $('pOf').textContent = of; $('pTitle').textContent = title; $('pDesc').textContent = desc;
    const ul = $('pSpecs'); ul.innerHTML=''; specs.forEach(s => { const li=document.createElement('li'); li.textContent=s; ul.appendChild(li); });
  }
  const playing = state.playing;
  $('playLabel').textContent = playing ? 'Pause' : (b >= N-0.001 ? 'Replay' : 'Build');
  $('playIcon').innerHTML = playing ? '<rect x="2.5" y="1.5" width="3" height="11" rx="1" fill="currentColor"/><rect x="8.5" y="1.5" width="3" height="11" rx="1" fill="currentColor"/>' : '<path d="M3 1.5v11l9-5.5z" fill="currentColor"/>';
}
$('btnPlay').addEventListener('click', () => {
  state.animTo = null;
  if (state.playing && state.dir > 0){ state.playing = false; }
  else { if (state.build >= N-0.001) state.build = 0; state.dir = 1; state.playing = true; }
  kick();
});
$('btnApart').addEventListener('click', () => { state.animTo = null; if (state.playing && state.dir < 0){ state.playing=false; } else { if (state.build <= 0.001) state.build = N; state.dir = -1; state.playing = true; } kick(); });
$('btnNext').addEventListener('click', () => { state.playing=false; state.animTo = Math.min(N, Math.floor(state.build+1e-3)+1); kick(); });
$('btnPrev').addEventListener('click', () => { state.playing=false; state.animTo = Math.max(0, Math.ceil(state.build-1e-3)-1); kick(); });
const bs = $('build');
bs.addEventListener('input', () => { dragging = true; state.playing=false; state.animTo=null; state.build = parseFloat(bs.value); kick(); });
bs.addEventListener('change', () => { dragging = false; kick(); });
const exs = $('explode');
exs.addEventListener('input', () => { state.exTarget = parseFloat(exs.value); $('exVal').textContent = Math.round(state.exTarget*100)+'%'; kick(); });
document.querySelectorAll('#toggles .chip').forEach(btn => btn.addEventListener('click', () => {
  const t = btn.dataset.t, on = btn.getAttribute('aria-pressed') !== 'true'; btn.setAttribute('aria-pressed', on ? 'true':'false'); state[t] = on;
  if (t==='house') house.visible = on;
  if (t==='grade') setGrade(on);
  if (t==='dims') dims.visible = on;
  if (t==='dusk' || t==='night'){ const other = t==='dusk' ? 'night' : 'dusk'; if (on){ state[other]=false; const ob=document.querySelector('#toggles .chip[data-t="'+other+'"]'); if (ob) ob.setAttribute('aria-pressed','false'); } setLight(on ? t : 'day'); }
  kick();
}));
window.addEventListener('keydown', e => { if (e.target && e.target.tagName === 'INPUT') return; if (e.key===' '){ e.preventDefault(); $('btnPlay').click(); } if (e.key==='ArrowRight') $('btnNext').click(); if (e.key==='ArrowLeft') $('btnPrev').click(); if (e.key==='Escape') clearSel(); });

/* ================================================================
   RESIZE & LOOP
================================================================ */
function resize(){
  const w = canvas.clientWidth || window.innerWidth, h = canvas.clientHeight || window.innerHeight;
  renderer.setSize(w, h, false);
  const mobile = window.innerWidth < 900;
  const sh = mobile ? sheet.getBoundingClientRect().height : 0;
  const shift = Math.min(h*0.35, sh*0.55);
  camera.aspect = w/(h+shift); camera.fov = 42 * (1 + shift/h*0.6);
  if (shift > 0) camera.setViewOffset(w, h+shift, 0, shift, w, h); else camera.clearViewOffset();
  camera.updateProjectionMatrix(); dirty = true;
}
window.addEventListener('resize', resize);
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); showProblem('Graphics memory ran out and the model was paused.<br><small>Reload the page to bring it back.</small>'); });
let dirty = true, last = performance.now(), changed = true;
function kick(){ changed = true; }
const SPEED = 0.55;
function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now-last)/1000); last = now;
  if (state.playing){ state.build += state.dir*dt*SPEED; if (state.dir>0 && state.build>=N){ state.build=N; state.playing=false; } if (state.dir<0 && state.build<=0){ state.build=0; state.playing=false; } changed = true; }
  else if (state.animTo !== null){ const d = state.animTo-state.build, st = dt*1.6; if (Math.abs(d) <= st){ state.build = state.animTo; state.animTo = null; } else state.build += Math.sign(d)*st; changed = true; }
  if (Math.abs(state.explode-state.exTarget) > 1e-4){ state.explode += (state.exTarget-state.explode)*Math.min(1, dt*9); if (Math.abs(state.explode-state.exTarget) < 1e-3) state.explode = state.exTarget; changed = true; }
  if (tween){ const t = clamp((now-tween.s)/tween.d, 0, 1), e = easeIO(t); camera.position.lerpVectors(tween.from.p, tween.to.p, e); controls.target.lerpVectors(tween.from.t, tween.to.t, e); if (t>=1) tween = null; dirty = true; }
  if (controls.update()) dirty = true;
  if (camera.position.y < 0.8){ camera.position.y = 0.8; }
  if (changed){ applyBuild(); updateUI(); changed = false; dirty = true; }
  if (dirty){ renderer.render(scene, camera); dirty = false; if (!checked) selfCheck(); }
}
let checked = false, fallbackLevel = 0;
function selfCheck(){
  checked = true;
  try {
    const gl = renderer.getContext(), w = gl.drawingBufferWidth, h = gl.drawingBufferHeight, px = new Uint8Array(4); let black = 0, n = 0;
    for (const [fx,fy] of [[0.5,0.5],[0.25,0.6],[0.75,0.6],[0.5,0.3],[0.15,0.85],[0.85,0.85],[0.5,0.9]]){ gl.readPixels(Math.floor(w*fx), Math.floor(h*fy), 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); n++; if (px[0]+px[1]+px[2] < 6) black++; }
    if (black === n){
      fallbackLevel++;
      if (fallbackLevel === 1){ renderer.shadowMap.enabled = false; scene.traverse(o => { if (o.material) [].concat(o.material).forEach(m => m.needsUpdate = true); }); }
      else if (fallbackLevel === 2){ renderer.toneMapping = THREE.NoToneMapping; renderer.setPixelRatio(1); resize(); scene.traverse(o => { if (o.material) [].concat(o.material).forEach(m => m.needsUpdate = true); }); }
      else { showProblem('Your device’s graphics couldn’t draw the model.<br><small>Try another browser or a computer.</small>'); return; }
      checked = false; dirty = true;
    } else { $('loading').classList.add('done'); }
  } catch (e) { $('loading').classList.add('done'); }
}

setDusk(false);
resize();
goView(VIEWS[0], true);
applyBuild(); updateUI();
requestAnimationFrame(loop);
setTimeout(() => { if (checked && fallbackLevel < 3) $('loading').classList.add('done'); }, 4000);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { lastPhaseShown = null; kick(); });
})();
</script>
</body>
